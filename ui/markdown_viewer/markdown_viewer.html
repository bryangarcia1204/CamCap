<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Viewer</title>

    <!-- CSS de GitHub -->
    <link rel="stylesheet" href="assets/github-markdown-dark.css">
    <link rel="stylesheet" href="assets/highlight-github-dark.css">

    <style>
        /* === Reset y layout base === */
        html, body {
            margin: 0;
            padding: 0;
            background: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         "Helvetica Neue", Arial, sans-serif;
            font-size: 14px;
            line-height: 1.6;
            overflow-x: hidden;
        }

        body {
            padding: 16px 24px 60px 24px;
            max-width: 100%;
        }

        /* === Contenedor del markdown === */
        .markdown-body {
            box-sizing: border-box;
            min-width: 200px;
            max-width: 100%;
            margin: 0 auto;
            background: transparent;
            color: #c9d1d9;
        }

        /* === Ajustes específicos para GitHub Dark === */
        .markdown-body {
            --color-canvas-default: #0d1117;
            --color-fg-default: #c9d1d9;
            --color-fg-muted: #8b949e;
            --color-border-default: #30363d;
            --color-accent-fg: #58a6ff;
            --color-accent-emphasis: #1f6feb;
        }

        .markdown-body h1,
        .markdown-body h2,
        .markdown-body h3,
        .markdown-body h4,
        .markdown-body h5,
        .markdown-body h6 {
            border-bottom-color: #21262d;
            color: #e6edf3;
        }

        .markdown-body a {
            color: #58a6ff;
        }

        .markdown-body a:hover {
            color: #79c0ff;
        }

        .markdown-body code {
            background-color: rgba(110, 118, 129, 0.4);
            color: #e6edf3;
            padding: 0.2em 0.4em;
            border-radius: 6px;
            font-size: 85%;
        }

        .markdown-body pre {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 16px;
            overflow-x: auto;
            position: relative;
        }

        .markdown-body pre code {
            background-color: transparent;
            color: #e6edf3;
            padding: 0;
            border-radius: 0;
            font-size: 85%;
        }

        .markdown-body blockquote {
            border-left: 4px solid #30363d;
            padding: 0 1em;
            color: #8b949e;
            margin-left: 0;
        }

        .markdown-body table {
            border-collapse: collapse;
            display: block;
            width: max-content;
            max-width: 100%;
            overflow: auto;
        }

        .markdown-body th,
        .markdown-body td {
            border: 1px solid #30363d;
            padding: 6px 13px;
        }

        .markdown-body th {
            background-color: #161b22;
            font-weight: 600;
        }

        .markdown-body tr:nth-child(even) td {
            background-color: #0d1117;
        }

        .markdown-body tr:nth-child(odd) td {
            background-color: #161b22;
        }

        .markdown-body hr {
            background-color: #30363d;
            border: 0;
            height: 1px;
            margin: 24px 0;
        }

        .markdown-body img {
            max-width: 100%;
            box-sizing: content-box;
            border-radius: 6px;
        }

        /* === Loading spinner === */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: #8b949e;
            font-style: italic;
        }

        /* === Botón de copiar en bloques de código === */
        .code-copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            color: #c9d1d9;
            font-size: 11px;
            padding: 3px 8px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.15s ease;
            font-family: inherit;
        }

        .markdown-body pre:hover .code-copy-btn {
            opacity: 1;
        }

        .code-copy-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .code-copy-btn.copied {
            background: rgba(46, 160, 67, 0.3);
            border-color: #2ea043;
            color: #3fb950;
        }

        /* === Scrollbar === */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #0d1117;
        }

        ::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 5px;
            border: 2px solid #0d1117;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #484f58;
        }
    </style>
</head>

<body>
    <div id="content" class="markdown-body">
        <div class="loading">Cargando viewer...</div>
    </div>

    <!-- Scripts -->
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <script src="assets/marked.min.js"></script>
    <script src="assets/highlight.min.js"></script>

    <script>
    (function() {
        'use strict';

        const contentEl = document.getElementById('content');

        // ==================== CONFIGURAR MARKED ====================
        if (typeof marked !== 'undefined') {
            marked.setOptions({
                gfm: true,
                breaks: false,
                headerIds: true,
                mangle: false,
                highlight: function(code, lang) {
                    if (typeof hljs !== 'undefined' && lang && hljs.getLanguage(lang)) {
                        try {
                            return hljs.highlight(code, { language: lang }).value;
                        } catch (e) {
                            console.warn('highlight error:', e);
                        }
                    }
                    return code;
                },
            });
        }

        // ==================== RENDER MARKDOWN ====================
        function renderMarkdown(text) {
            if (!text || !text.trim()) {
                contentEl.innerHTML =
                    '<div class="loading">Sin contenido</div>';
                return;
            }

            let html = '';
            try {
                if (typeof marked !== 'undefined') {
                    html = marked.parse(text);
                } else {
                    // Fallback ultra básico
                    html = '<pre>' + escapeHtml(text) + '</pre>';
                }
            } catch (e) {
                console.error('marked error:', e);
                html = '<pre>Error renderizando markdown:\n' +
                       escapeHtml(String(e)) + '</pre>';
            }

            contentEl.innerHTML = html;

            // Aplicar highlight.js a bloques de código sin lenguaje
            if (typeof hljs !== 'undefined') {
                contentEl.querySelectorAll('pre code').forEach((block) => {
                    try {
                        hljs.highlightElement(block);
                    } catch (e) {
                        // Ignorar
                    }
                });
            }

            // Añadir botón de copiar a cada bloque de código
            contentEl.querySelectorAll('pre').forEach((pre) => {
                addCopyButton(pre);
            });

            // Interceptar clicks en links para enviar al bridge
            contentEl.querySelectorAll('a').forEach((a) => {
                a.addEventListener('click', function(ev) {
                    const href = this.getAttribute('href') || '';
                    if (href.startsWith('#')) {
                        // Ancla interna: dejar scroll nativo
                        return;
                    }
                    ev.preventDefault();
                    if (window.bridge) {
                        window.bridge.onLinkClicked(href);
                    }
                });
            });

            // Scroll al top
            window.scrollTo(0, 0);
        }

        // ==================== COPIAR BLOQUES DE CÓDIGO ====================
        function addCopyButton(preEl) {
            if (preEl.querySelector('.code-copy-btn')) {
                return;
            }
            const btn = document.createElement('button');
            btn.className = 'code-copy-btn';
            btn.textContent = '📋 Copiar';
            btn.addEventListener('click', function(ev) {
                ev.stopPropagation();
                const code = preEl.querySelector('code');
                const text = code ? code.innerText : preEl.innerText;
                copyToClipboard(text);
                btn.textContent = '✓ Copiado';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = '📋 Copiar';
                    btn.classList.remove('copied');
                }, 1500);
            });
            preEl.appendChild(btn);
        }

        function copyToClipboard(text) {
            // Intentar con la API moderna
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).catch(() => {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
            // Notificar al bridge
            if (window.bridge) {
                try { window.bridge.onCopyRequested(text); } catch (e) {}
            }
        }

        function fallbackCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            try {
                document.execCommand('copy');
            } catch (e) {}
            document.body.removeChild(ta);
        }

        // ==================== UTILIDADES ====================
        function escapeHtml(s) {
            return s
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // ==================== QWEBCHANNEL ====================
        function initBridge() {
            if (typeof QWebChannel === 'undefined') {
                console.warn('QWebChannel no cargado; modo standalone');
                return;
            }

            new QWebChannel(qt.webChannelTransport, function(channel) {
                const bridge = channel.objects.bridge;
                window.bridge = bridge;

                // Render inicial
                if (bridge.text) {
                    renderMarkdown(bridge.text);
                }

                // Escuchar cambios
                bridge.textChanged.connect(function(text) {
                    renderMarkdown(text);
                });

                // Notificar listo
                try {
                    bridge.onReady();
                } catch (e) {}

                // Aplicar base_url a links e imágenes relativas
                bridge.baseUrlChanged.connect(function(baseUrl) {
                    if (baseUrl) {
                        const base = document.createElement('base');
                        base.href = baseUrl;
                        document.head.appendChild(base);
                    }
                });
                if (bridge.baseUrl) {
                    const base = document.createElement('base');
                    base.href = bridge.baseUrl;
                    document.head.appendChild(base);
                }
            });
        }

        // ==================== INICIALIZACIÓN ====================
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initBridge);
        } else {
            initBridge();
        }

        // Exponer renderMarkdown para debug manual
        window.renderMarkdown = renderMarkdown;
    })();
    </script>
</body>
</html>
