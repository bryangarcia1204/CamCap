[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --timeout=30
    --timeout-method=thread
markers =
    gui: tests que requieren QApplication (Qt)
    slow: tests que tardan >1s
    network: tests que requieren red
filterwarnings =
    ignore::DeprecationWarning